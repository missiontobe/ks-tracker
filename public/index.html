<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <title>Kingshot RSS Tile Timer</title>
  </head>
  <body>
    <header class="is-fixed-above-lg">
      <div class="container">
        <h1>Kingshot RSS Tile Timer</h1>
      </div>
    </header>
    <main>
      <div class="container">
        Lorem Ipsum ...
      </div>
      <div class="container">
        <form id="ksForm">
          <div class="grid">
            <div>
              <label for="ksBlueHero">Blue Hero</label>
              <select id="ksBlueHero" name="ksBlueHero" required>
                <option value="0">None</option>
                <option value="1">Skill Level 1</option>
                <option value="2">Skill Level 2</option>
                <option value="3">Skill Level 3</option>
                <option value="4">Skill Level 4</option>
                <option selected value="5">Skill Level 5</option>
              </select>
            </div>
            <div>&nbsp;</div>
            <div>
                <label for="ksReturnTime">Returns</label>
                <input type="datetime-local" id="ksReturnTime" name="ksReturnTime" value="2026-12-24T20:00" readonly />
            </div>
          </div>
          <div class="grid">
            <div>
              <label for="ksTimeToDestinationMinutes">Minutes</label>
              <input type="number" id="ksTimeToDestinationMinutes" name="ksTimeToDestinationMinutes" value="0" />
            </div>
            <div>
              <label for="ksTimeToDestinationSeconds">Seconds</label>
              <input type="number" id="ksTimeToDestinationSeconds" name="ksTimeToDestinationSeconds" value="20" />
            </div>
            <div>
              <label for="ksGatheringBonus">Bonus (in %)</label>
              <input type="number" id="ksGatheringBonus" name="ksGatheringBonus" value="339" />
            </div>
          </div>
          <div class="grid">
            <div>
              <label for="ksUnitsInf">Inf T10</label>
              <input type="number" id="ksUnitsInf" name="ksUnitsInf" value="14141" />
            </div>
            <div>
              <label for="ksUnitsCav">Cav T10</label>
              <input type="number" id="ksUnitsCav" name="ksUnitsCav" value="14141" />
            </div>
            <div>
              <label for="ksUnitsArc">Arc T10</label>
              <input type="number" id="ksUnitsArc" name="ksUnitsArc" value="14141" />
            </div>
          </div>
        </form>
      </div>
    </main>
    <footer>
      <div class="container">made with ❤️ by Luci (Kingdom 1139)</div>
    </footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
